name: Build releases on master

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

concurrency:
  group: build-releases-master-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      release_title: ${{ steps.release_meta.outputs.release_title }}
    steps:
      - name: Compute release metadata
        id: release_meta
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "release_tag=master-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "release_title=Master build ${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Create per-merge master release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.release_meta.outputs.release_tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists for ${GITHUB_SHA}; continuing."
          else
            gh release create "${{ steps.release_meta.outputs.release_tag }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${{ steps.release_meta.outputs.release_title }}" \
              --notes "Automated release artifacts for merge commit ${GITHUB_SHA} on master." \
              --prerelease
          fi

  linux:
    needs: prepare_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install packaging tools (deb / rpm / AppImage helpers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm libarchive-tools

      - name: Setup JDK 17 (IntelliJ Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Build IntelliJ plugin (Gradle)
        run: npm run build:intellij-plugin

      - name: Package Linux release artifacts (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --linux deb AppImage zip pacman

      - name: Build Linux unpacked app for smoke test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --linux dir

      - name: Smoke test Linux packaged app
        run: node scripts/release-smoke-check.mjs --platform linux --releaseDir release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-linux-x64
          path: |
            release/*.deb
            release/*.AppImage
            release/*.zip
            release/*.pkg.tar.*
            release/*.pacman
          if-no-files-found: error

      - name: Package Linux CPU flavor (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --config electron-builder.linux-cpu.yml --linux deb AppImage zip pacman

      - name: Upload Linux CPU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-linux-cpu-x64
          path: |
            release/*-linux-cpu-*.deb
            release/*-linux-cpu-*.AppImage
            release/*-linux-cpu-*.zip
            release/*-linux-cpu-*.pkg.tar.*
            release/*-linux-cpu-*.pacman
          if-no-files-found: error

      - name: Upload IntelliJ plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-intellij-plugin
          path: integrations/intellij-plugin/build/distributions/local-llm-intellij-*.zip
          if-no-files-found: error

      - name: Publish Linux artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release/*.deb
            release/*.AppImage
            release/*.zip
            release/*.pkg.tar.*
            release/*.pacman
            release/*.yml
            integrations/intellij-plugin/build/distributions/local-llm-intellij-*.zip
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux/plugin files to upload"
            exit 1
          fi
          gh release upload "${{ needs.prepare_release.outputs.release_tag }}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Setup ORAS (GitHub Packages publish)
        uses: oras-project/setup-oras@v1

      - name: Publish Linux bundle to GitHub Packages (GHCR)
        env:
          ORAS_USER: ${{ github.actor }}
          ORAS_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release/*.deb
            release/*.AppImage
            release/*.zip
            release/*.pkg.tar.*
            release/*.pacman
            release/*.yml
            integrations/intellij-plugin/build/distributions/local-llm-intellij-*.zip
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux files to publish to GHCR"
            exit 1
          fi
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner}/local-llm-desktop-releases:${{ needs.prepare_release.outputs.release_tag }}-linux"
          echo "${ORAS_PASSWORD}" | oras login ghcr.io -u "${ORAS_USER}" --password-stdin
          oras push "${ref}" "${files[@]}"

  windows:
    needs: prepare_release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17 (IntelliJ Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Build IntelliJ plugin (Gradle)
        run: npm run build:intellij-plugin

      - name: Package Windows release artifacts (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --win nsis zip

      - name: Build Windows unpacked app for smoke test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --win dir

      - name: Smoke test Windows packaged app
        run: node scripts/release-smoke-check.mjs --platform windows --releaseDir release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-win-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Publish Windows artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in @('.exe', '.zip', '.yml') }
          if (-not $files -or $files.Count -eq 0) {
            throw "No Windows files to upload"
          }
          $paths = $files | ForEach-Object { $_.FullName }
          gh release upload "${{ needs.prepare_release.outputs.release_tag }}" @paths --clobber --repo $env:GITHUB_REPOSITORY

      - name: Setup ORAS (GitHub Packages publish)
        uses: oras-project/setup-oras@v1

      - name: Publish Windows bundle to GitHub Packages (GHCR)
        env:
          ORAS_USER: ${{ github.actor }}
          ORAS_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in @('.exe', '.zip', '.yml') }
          if (-not $files -or $files.Count -eq 0) {
            throw "No Windows files to publish to GHCR"
          }
          $paths = $files | ForEach-Object { Join-Path 'release' $_.Name }
          $owner = $env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant()
          $ref = "ghcr.io/$owner/local-llm-desktop-releases:${{ needs.prepare_release.outputs.release_tag }}-windows"
          $env:ORAS_PASSWORD | oras login ghcr.io -u $env:ORAS_USER --password-stdin
          oras push $ref @paths

  macos:
    needs: prepare_release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17 (IntelliJ Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Build IntelliJ plugin (Gradle)
        run: npm run build:intellij-plugin

      - name: Package macOS release artifacts (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --mac dmg zip

      - name: Build macOS unpacked app for smoke test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --mac dir

      - name: Smoke test macOS packaged app
        run: node scripts/release-smoke-check.mjs --platform macos --releaseDir release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Publish macOS artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release/*.dmg
            release/*.zip
            release/*.yml
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS files to upload"
            exit 1
          fi
          gh release upload "${{ needs.prepare_release.outputs.release_tag }}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Setup ORAS (GitHub Packages publish)
        uses: oras-project/setup-oras@v1

      - name: Publish macOS bundle to GitHub Packages (GHCR)
        env:
          ORAS_USER: ${{ github.actor }}
          ORAS_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release/*.dmg
            release/*.zip
            release/*.yml
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS files to publish to GHCR"
            exit 1
          fi
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner}/local-llm-desktop-releases:${{ needs.prepare_release.outputs.release_tag }}-macos"
          echo "${ORAS_PASSWORD}" | oras login ghcr.io -u "${ORAS_USER}" --password-stdin
          oras push "${ref}" "${files[@]}"

  verify_release_assets:
    needs:
      - prepare_release
      - linux
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - name: Validate all platform assets exist on GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')

          if [ ${#assets[@]} -eq 0 ]; then
            echo "Release ${RELEASE_TAG} has no assets."
            exit 1
          fi

          has_linux=0
          has_windows=0
          has_macos=0

          for a in "${assets[@]}"; do
            case "$a" in
              *.AppImage|*.deb|*.pkg.tar.*|*.pacman) has_linux=1 ;;
            esac
            case "$a" in
              *.exe) has_windows=1 ;;
            esac
            case "$a" in
              *.dmg) has_macos=1 ;;
            esac
          done

          if [ "$has_linux" -ne 1 ]; then
            echo "Missing Linux release assets on ${RELEASE_TAG}."
            exit 1
          fi
          if [ "$has_windows" -ne 1 ]; then
            echo "Missing Windows release assets on ${RELEASE_TAG}."
            exit 1
          fi
          if [ "$has_macos" -ne 1 ]; then
            echo "Missing macOS release assets on ${RELEASE_TAG}."
            exit 1
          fi

          echo "Release ${RELEASE_TAG} contains Linux, Windows, and macOS assets."
