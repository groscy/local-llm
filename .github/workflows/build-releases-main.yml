name: Build releases on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-releases-main-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_RELEASE_TAG: main-latest

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure rolling main release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${MAIN_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${MAIN_RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Main branch rolling build" \
              --notes "Latest artifacts from merges to main." \
              --prerelease
          else
            gh release create "${MAIN_RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Main branch rolling build" \
              --notes "Latest artifacts from merges to main." \
              --prerelease
          fi

  linux:
    needs: prepare_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install packaging tools (deb / rpm / AppImage helpers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm libarchive-tools

      - name: Setup JDK 17 (IntelliJ Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Build IntelliJ plugin (Gradle)
        run: npm run build:intellij-plugin

      - name: Package Linux release artifacts (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --linux deb AppImage zip pacman

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-linux-x64
          path: |
            release/*.deb
            release/*.AppImage
            release/*.zip
            release/*.pkg.tar.*
          if-no-files-found: error

      - name: Package Linux CPU flavor (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --config electron-builder.linux-cpu.yml --linux deb AppImage zip pacman

      - name: Upload Linux CPU artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-linux-cpu-x64
          path: |
            release/*-linux-cpu-*.deb
            release/*-linux-cpu-*.AppImage
            release/*-linux-cpu-*.zip
            release/*-linux-cpu-*.pkg.tar.*
          if-no-files-found: error

      - name: Upload IntelliJ plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-intellij-plugin
          path: integrations/intellij-plugin/build/distributions/local-llm-intellij-*.zip
          if-no-files-found: error

      - name: Publish Linux artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release/*.deb
            release/*.AppImage
            release/*.zip
            release/*.pkg.tar.*
            release/*.yml
            integrations/intellij-plugin/build/distributions/local-llm-intellij-*.zip
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux/plugin files to upload"
            exit 1
          fi
          gh release upload "${MAIN_RELEASE_TAG}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"

  windows:
    needs: prepare_release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17 (IntelliJ Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Build IntelliJ plugin (Gradle)
        run: npm run build:intellij-plugin

      - name: Package Windows release artifacts (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --win nsis zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-win-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Publish Windows artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File -Include *.exe,*.zip,*.yml
          if (-not $files -or $files.Count -eq 0) {
            throw "No Windows files to upload"
          }
          $paths = $files | ForEach-Object { $_.FullName }
          gh release upload $env:MAIN_RELEASE_TAG @paths --clobber --repo $env:GITHUB_REPOSITORY

  macos:
    needs: prepare_release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17 (IntelliJ Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Build IntelliJ plugin (Gradle)
        run: npm run build:intellij-plugin

      - name: Package macOS release artifacts (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --mac dmg zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: Publish macOS artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            release/*.dmg
            release/*.zip
            release/*.yml
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS files to upload"
            exit 1
          fi
          gh release upload "${MAIN_RELEASE_TAG}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
