name: Build Linux release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install packaging tools (deb / rpm / AppImage helpers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Package (electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --linux deb AppImage zip pacman

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-linux-x64
          path: |
            release/*.deb
            release/*.AppImage
            release/*.zip
            release/*.pkg.tar.*
          if-no-files-found: error
