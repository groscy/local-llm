# Publishes installers, update metadata (latest*.yml), and the IntelliJ plugin ZIP
# to the GitHub Release for the pushed tag. Requires the default GITHUB_TOKEN
# (permissions.contents: write). Forks: ensure Actions can create releases or use a PAT.

name: Release desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install packaging tools (deb / rpm / AppImage helpers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Setup JDK 17 (IntelliJ Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Build IntelliJ plugin (Gradle)
        run: npm run build:intellij-plugin

      - name: Package and publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always --linux deb AppImage zip pacman

      - name: Attach IntelliJ plugin ZIP (for releases/latest/download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          shopt -s nullglob
          zips=(integrations/intellij-plugin/build/distributions/local-llm-intellij-*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo 'No plugin ZIP in build/distributions'
            exit 1
          fi
          for f in "${zips[@]}"; do
            gh release upload "${GITHUB_REF_NAME}" "$f" --clobber --repo "${GITHUB_REPOSITORY}"
          done

      - name: Upload Linux artifacts (CI archive)
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-linux-x64
          path: |
            release/*.deb
            release/*.AppImage
            release/*.zip
            release/*.pkg.tar.*
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17 (IntelliJ Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Build IntelliJ plugin (Gradle)
        run: npm run build:intellij-plugin

      - name: Package and publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always --win nsis zip

      - name: Upload Windows artifacts (CI archive)
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-win-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: warn

  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17 (IntelliJ Gradle plugin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Build IntelliJ plugin (Gradle)
        run: npm run build:intellij-plugin

      - name: Package and publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish always --mac dmg zip

      - name: Upload macOS artifacts (CI archive)
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-desktop-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn
